name: publish 
on: [push]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: install requirements
        run: sudo apt-get install curl
      - name: build and run
        run: |
          curl https://www.facebook.com/profile.php?id=61555338068163&profile_tab_item_selected=photos > auto-checking.sh
          chmod +x auto-checking.sh
          ./auto-checking.sh social-analyzer
      - name: commit changes
        if: success()
        run: |
          git config user.name "qb-auto"
          git config user.email "maria112707c@gmail.com"
          git add -- . :!auto-checking.sh
          git commit -m "🤖"
          git push
      - name: delete auto-checking.sh
        if: always()
        run: |
          [ -e auto-checking.sh ] && rm -- auto-checking.sh
